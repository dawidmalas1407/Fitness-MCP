services:
  yazio:
    build:
      context: ./yazio
    restart: unless-stopped
    environment:
      - YAZIO_USERNAME=${YAZIO_USERNAME:?YAZIO_USERNAME fehlt in .env}
      - YAZIO_PASSWORD=${YAZIO_PASSWORD:?YAZIO_PASSWORD fehlt in .env}
      - TZ=Europe/Berlin

  garmin:
    build:
      context: ./garmin-mcp-server
    restart: unless-stopped
    volumes:
      - ./garmin-tokens:/root/.garminconnect
    environment:
      - TZ=Europe/Berlin

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # nur lokal; nach außen geht es über Tailscale Funnel
    environment:
      - MCP_TOKEN=${MCP_TOKEN:?MCP_TOKEN fehlt in .env oder ist leer}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - yazio
      - garmin
